name: JunoWatch
options:
  bundleIdPrefix: io.github.nigelleong0703
  deploymentTarget:
    watchOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  JunoWatch:
    type: application
    platform: watchOS
    sources:
      - JunoWatch
      # The iPhone app's character art as HEIC (watchOS cannot decode WebP), only the clips the watch plays.
      - path: Characters
        buildPhase: resources
      # CoreML voice models (scripts/fetch-models.sh, not committed) and their licenses.
      - path: Models
        buildPhase: resources
        type: folder
    info:
      path: Config/Info.plist
      properties:
        WKApplication: true
        WKWatchOnly: true
        NSMicrophoneUsageDescription: Juno listens while you talk to it.
        JunoServerURL: $(JUNO_SERVER_URL)
    configFiles:
      Debug: Config/Juno.xcconfig
      Release: Config/Juno.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.nigelleong0703.juno.watch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Juno
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
