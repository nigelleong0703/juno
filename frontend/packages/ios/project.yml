name: Juno
options:
  bundleIdPrefix: io.github.nigelleong0703
  deploymentTarget:
    iOS: "26.0"
packages:
  Textual:
    url: https://github.com/gonzalezreal/textual
    from: 0.5.0
  ChatLayout:
    url: https://github.com/ekazaev/ChatLayout.git
    exactVersion: 2.5.2
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 7.11.1
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    exactVersion: 2.19.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Juno:
    type: application
    platform: iOS
    sources:
      - Juno
      # The document editor page (packages/doc-editor), built by the pre-build script below; git-ignored.
      - path: DocEditor
        type: folder
    preBuildScripts:
      - name: Build document editor page
        basedOnDependencyAnalysis: false
        script: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$HOME/.nvm/versions/node/current/bin:$PATH"
          cd "$SRCROOT/../.." && node scripts/build/doc-editor-ios.mjs
    dependencies:
      - package: Textual
        product: Textual
      - package: ChatLayout
        product: ChatLayout
      - package: GRDB
        product: GRDB
      - package: LiveKit
        product: LiveKit
    info:
      path: Config/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: juno-bean
        # With limited photo access the system would otherwise ask to change the selection in the middle of an agent's search;
        # the owner changes it from Settings > iPhone access > Photos instead.
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
    configFiles:
      Debug: Config/Juno.xcconfig
      Release: Config/Juno.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.nigelleong0703.juno
        # The pre-build script writes packages/ios/DocEditor from the web editor's sources.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Juno
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_NSCameraUsageDescription: Take a photo to send to your agent.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Juno uses your microphone when you dictate or start a voice call with your agent.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Juno uses Face ID to fill in your saved details.
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Juno lets your agent look at your calendar and add events to it, while the app is open. It asks you before it changes anything.
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: Juno lets your agent look at your reminders and add or complete them, while the app is open. It asks you before it changes anything.
        INFOPLIST_KEY_NSContactsUsageDescription: Juno lets your agent look people up in your contacts and add a contact or a number, while the app is open. It asks you before it adds anything.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Juno lets your agent ask where you are when you ask it for something, while the app is open. Nothing is tracked.
        INFOPLIST_KEY_NSHealthShareUsageDescription: Juno lets your agent read totals for your steps, workouts, sleep and weight when you ask it about them, while the app is open. It never writes to Health.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Juno lets your agent search your photos and, when you say yes, send one into a chat, while the app is open. It never changes or deletes photos.
        INFOPLIST_KEY_NSAppleMusicUsageDescription: Juno lets your agent see what is playing and play or pause music from your library and Apple Music for you, while the app is open.
        INFOPLIST_KEY_NSHomeKitUsageDescription: Juno lets your agent see your lights and other home accessories and turn them on or off, while the app is open. It asks you before it changes anything, and never touches locks or alarms.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: "$(JUNO_PUSH_ENTITLEMENTS)"
        OTHER_SWIFT_FLAGS: "$(inherited) $(JUNO_PUSH_SWIFT_FLAG)"
  JunoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [JunoTests]
    dependencies:
      - target: Juno
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.nigelleong0703.juno.unittests
        GENERATE_INFOPLIST_FILE: YES
  JunoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [JunoUITests]
    dependencies:
      - target: Juno
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.nigelleong0703.juno.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Juno
schemes:
  Juno:
    build:
      targets:
        Juno: all
        JunoTests: [test]
        JunoUITests: [test]
    test:
      targets: [JunoTests, JunoUITests]
